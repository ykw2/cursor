<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="中秋節快樂。寫下一句祝福，留給想團圓的人。" />
    <title>中秋節快樂</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip" href="#main">跳到祝福</a>
    <header class="site-header">
      <div class="header-inner">
        <p class="brand">中秋</p>
        <p class="date">農曆八月十五</p>
      </div>
    </header>

    <main id="main">
      <section class="sky" aria-label="中秋夜空">
        <div class="lantern lantern-left" aria-hidden="true"></div>
        <div class="lantern lantern-right" aria-hidden="true"></div>
        <div class="moon" aria-hidden="true"></div>
        <p class="kicker">月圓人團圓</p>
        <h1>中秋節快樂</h1>
        <p class="lead">桂花剛開的夜晚，把一句話留給想見面的人。</p>
      </section>

      <section class="desk">
        <form id="wish-form" class="wish-form">
          <div class="field">
            <label for="wish-name">送給</label>
            <input id="wish-name" name="name" type="text" maxlength="20" placeholder="例如：家裡的人" autocomplete="name" />
          </div>
          <div class="field">
            <div class="field-head">
              <label for="wish-message">一句祝福</label>
              <span id="wish-length" class="count">0/80</span>
            </div>
            <textarea id="wish-message" name="message" maxlength="80" rows="3" placeholder="願團圓的桌子，今年不再空一席。"></textarea>
          </div>
          <div class="presets" role="group" aria-label="現成的句子">
            <button type="button" data-preset="月圓人圓，歲歲平安。">月圓人圓</button>
            <button type="button" data-preset="今晚的月色，留給想團圓的人。">今晚的月色</button>
            <button type="button" data-preset="桂花香裡，吃塊月餅就好。">桂花與月餅</button>
          </div>
          <p class="hint">寫下的話只留在這台瀏覽器，重新整理還在。</p>
        </form>

        <article class="card" aria-live="polite">
          <p class="card-kicker">中秋賀卡</p>
          <p class="card-to">送給 <strong id="card-name">想見面的人</strong></p>
          <h2>中秋節快樂</h2>
          <p id="card-message" class="card-message">願團圓的桌子，今年不再空一席。</p>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <p>中秋夜，人在就好。</p>
    </footer>
    <script type="module" src="/src/scripts/main.js"></script>
  </body>
</html>
